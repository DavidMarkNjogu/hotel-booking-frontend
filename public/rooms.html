        },
        {

            bed_type: "King",
            max_occupancy: 3,
            room_size: 60,
            price_per_night: 449,
            image_url: "/assets/images/rooms/room-9.jpg",
            status: "limited",
            amenities: ["Wi-Fi", "Pool", "Spa", "Gym", "Restaurant"]
        }
    ];

    let allRooms = [...mockRooms];
    let filteredRooms = [...mockRooms];
    let currentPage = 1;
    const roomsPerPage = 9;

    // Render Room Card
    function renderRoomCard(room) {
        const statusClass = room.status === 'limited' ? 'limited' : room.status === 'booked' ? 'booked' : '';
        const statusText = room.status === 'available' ? 'Available' : room.status === 'limited' ? 'Limited' : 'Booked';

        return `
            <div class="property-card">
                <div class="property-image">
                    <img src="${room.image_url}" alt="${room.room_type}" onerror="this.src='https://via.placeholder.com/400x400?text=${room.room_type}'">
                    <div class="sale-status ${statusClass}">${statusText}</div>
                </div>
                <div class="property-details">
                    <h4>${room.room_type}</h4>
                    <div class="property-meta">
                        ${room.bed_type} • ${room.max_occupancy} Guests • ${room.room_size} sqm
                    </div>
                    <div class="property-price">
                        $${room.price_per_night}<span>/night</span>
                    </div>
                    <a href="/public/room-detail.html?id=${room.id}" class="button-secondary" style="width: 100%;">
                        View Details
                    </a>
                </div>
            </div>
        `;
    }

    // Render Rooms
    function renderRooms() {
        const grid = document.getElementById('rooms-grid');
        const noResults = document.getElementById('no-results');

        if (filteredRooms.length === 0) {
            grid.innerHTML = '';
            noResults.style.display = 'block';
            return;
        }

        noResults.style.display = 'none';

        const startIndex = (currentPage - 1) * roomsPerPage;
        const endIndex = startIndex + roomsPerPage;
        const roomsToShow = filteredRooms.slice(startIndex, endIndex);

        grid.innerHTML = roomsToShow.map(room => renderRoomCard(room)).join('');

        // Update pagination info
        document.getElementById('showing-start').textContent = startIndex + 1;
        document.getElementById('showing-end').textContent = Math.min(endIndex, filteredRooms.length);
        document.getElementById('total-rooms').textContent = filteredRooms.length;

        renderPagination();
    }

    // Render Pagination
    function renderPagination() {
        const totalPages = Math.ceil(filteredRooms.length / roomsPerPage);
        const pagination = document.getElementById('pagination');

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = '';

        // Previous button
        html += `<a href="#" class="pagination-item ${currentPage === 1 ? 'disabled' : ''}" data-page="${currentPage - 1}">Previous</a>`;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            html += `<a href="#" class="pagination-item ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</a>`;
        }

        // Next button
        html += `<a href="#" class="pagination-item ${currentPage === totalPages ? 'disabled' : ''}" data-page="${currentPage + 1}">Next</a>`;

        pagination.innerHTML = html;

        // Add click handlers
        pagination.querySelectorAll('.pagination-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                if (!item.classList.contains('disabled') && !item.classList.contains('active')) {
                    currentPage = parseInt(item.getAttribute('data-page'));
                    renderRooms();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        });
    }

    // Filter by Amenity
    document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');

            const amenity = pill.getAttribute('data-amenity');
            if (amenity === '') {
                filteredRooms = [...allRooms];
            } else {
                filteredRooms = allRooms.filter(room => room.amenities.includes(amenity));
            }

            currentPage = 1;
            renderRooms();
        });
    });

    // Filter Form Submission
    document.getElementById('room-filter-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const filters = {
            location: formData.get('location'),
            check_in: formData.get('check_in'),
            check_out: formData.get('check_out'),
            guests: formData.get('guests'),
            price_range: formData.get('price_range')
        };

        // Validate dates
        if (filters.check_in && filters.check_out) {
            const dateError = BookingUtils.validateDates(filters.check_in, filters.check_out);
            if (dateError) {
                LuxeStay.showToast(dateError, 'error');
                return;
            }
        }

        LuxeStay.showLoading();

        // In production, fetch from API
        // const response = await LuxeStay.apiRequest(`/api/rooms?${new URLSearchParams(filters)}`);

        // For now, simulate API call with timeout
        setTimeout(() => {
            // Filter mock data based on criteria
            filteredRooms = allRooms.filter(room => {
                // Price range filter
                if (filters.price_range) {
                    const [min, max] = filters.price_range.split('-').map(p => parseInt(p.replace('+', '')) || Infinity);
                    if (room.price_per_night < min || (max && room.price_per_night > max)) {
                        return false;
                    }
                }

                // Guests filter
                if (filters.guests && room.max_occupancy < parseInt(filters.guests)) {
                    return false;
                }

                return true;
            });

            currentPage = 1;
            renderRooms();
            LuxeStay.hideLoading();
            LuxeStay.showToast(`Found ${filteredRooms.length} available rooms`, 'success');

            // Scroll to results
            document.querySelector('.rooms-section').scrollIntoView({ behavior: 'smooth' });
        }, 1000);
    });

    // Initial render
    renderRooms();
</script>
