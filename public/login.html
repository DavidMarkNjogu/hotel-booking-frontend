<script>
    // Tab Switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tabName = btn.getAttribute('data-tab');

            // Update active tab button
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Update active tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}-tab`).classList.add('active');
        });
    });

    // Check URL for tab parameter
    const urlParams = new URLSearchParams(window.location.search);
    const tab = urlParams.get('tab');
    if (tab === 'register') {
        document.querySelector('.tab-btn[data-tab="register"]').click();
    }

    // Password Toggle
    document.querySelectorAll('.password-toggle').forEach(toggle => {
        toggle.addEventListener('click', () => {
            const input = toggle.previousElementSibling;
            const icon = toggle.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });

    // Password Strength Indicator
    const registerPassword = document.getElementById('register-password');
    if (registerPassword) {
        registerPassword.addEventListener('input', () => {
            const password = registerPassword.value;
            const strength = LuxeStay.Validation.passwordStrength(password);

            const fill = document.querySelector('.password-strength-fill');
            const text = document.querySelector('.password-strength-text');

            fill.className = `password-strength-fill ${strength}`;
            text.className = `password-strength-text ${strength}`;
            text.textContent = strength.charAt(0).toUpperCase() + strength.slice(1);
        });
    }

    // Forgot Password Modal
    document.getElementById('forgot-password-link')?.addEventListener('click', (e) => {
        e.preventDefault();
        LuxeStay.openModal('forgot-password-modal');
    });

    // Send Reset Link
    document.getElementById('send-reset-link')?.addEventListener('click', async () => {
        const form = document.getElementById('forgot-password-form');
        const email = form.querySelector('input[name="email"]').value;

        if (!LuxeStay.Validation.email(email)) {
            LuxeStay.showToast('Please enter a valid email address', 'error');
            return;
        }

        const btn = document.getElementById('send-reset-link');
        LuxeStay.setButtonLoading(btn, true);

        try {
            await LuxeStay.apiRequest('/api/auth/forgot-password', 'POST', { email });
            LuxeStay.showToast('Password reset link sent to your email', 'success');
            LuxeStay.closeModal('forgot-password-modal');
            form.reset();
        } catch (error) {
            LuxeStay.showToast(error.message || 'Failed to send reset link', 'error');
        } finally {
            LuxeStay.setButtonLoading(btn, false);
        }
    });

    // Login Form Submission
    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        if (!LuxeStay.validateForm(form)) return;

        const formData = {
            email: form.email.value,
            password: form.password.value
        };

        const submitBtn = form.querySelector('[type="submit"]');
        LuxeStay.setButtonLoading(submitBtn, true);

        try {
            const response = await LuxeStay.apiRequest('/api/auth/login', 'POST', formData);

            if (response.success) {
                // Store auth token and user data
                localStorage.setItem('auth_token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));

                LuxeStay.showToast('Login successful!', 'success');

                // Redirect to profile or previous page
                const redirectUrl = urlParams.get('redirect') || '/public/profile.html';
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            }
        } catch (error) {
            LuxeStay.showToast(error.message || 'Login failed. Please check your credentials.', 'error');
        } finally {
            LuxeStay.setButtonLoading(submitBtn, false);
        }
    });

    // Register Form Submission
    document.getElementById('register-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        if (!LuxeStay.validateForm(form)) return;

        const formData = {
            full_name: form.full_name.value,
            email: form.email.value,
            phone: form.phone.value,
            password: form.password.value
        };

        const submitBtn = form.querySelector('[type="submit"]');
        LuxeStay.setButtonLoading(submitBtn, true);

        try {
            const response = await LuxeStay.apiRequest('/api/auth/register', 'POST', formData);

            if (response.success) {
                // Store auth token and user data
                localStorage.setItem('auth_token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));

                LuxeStay.showToast('Account created successfully!', 'success');

                // Redirect to profile
                setTimeout(() => {
                    window.location.href = '/public/profile.html';
                }, 1000);
            }
        } catch (error) {
            LuxeStay.showToast(error.message || 'Registration failed. Please try again.', 'error');
        } finally {
            LuxeStay.setButtonLoading(submitBtn, false);
        }
    });

    // Social Login Handlers
    document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const provider = btn.classList.contains('google') ? 'google' : 'facebook';
            LuxeStay.showToast(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login not yet implemented`, 'info');
            // In production, redirect to OAuth provider
            // window.location.href = `/api/auth/${provider}`;
        });
    });
</script>
