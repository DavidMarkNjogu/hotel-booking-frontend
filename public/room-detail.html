<script>
    // Mock room data (replace with API call)
    const mockRoomData = {
        id: 1,
        room_number: "101",
        room_type: "Deluxe Suite",
        bed_type: "King",
        bed_count: 1,
        max_occupancy: 2,
        room_size: 45,
        view_type: "City View",
        price_per_night: 199,
        description: "Elegant suite with modern amenities and stunning city views. This spacious accommodation features premium furnishings, a comfortable king-size bed, and a luxurious bathroom with rainfall shower. Perfect for business travelers and couples seeking comfort and style.",
        images: [
            "https://via.placeholder.com/800x500?text=Main+View",
            "https://via.placeholder.com/800x500?text=Bathroom",
            "https://via.placeholder.com/800x500?text=City+View",
            "https://via.placeholder.com/800x500?text=Bed",
            "https://via.placeholder.com/800x500?text=Sitting+Area"
        ],
        amenities: ["Wi-Fi", "Air Conditioning", "Mini Bar", "TV", "Safe", "Coffee Maker", "Bathrobe", "Slippers", "Hair Dryer", "Iron"],
        policies: {
            check_in_time: "3:00 PM",
            check_out_time: "12:00 PM",
            cancellation_policy: "Free cancellation up to 24 hours before check-in",
            deposit_required: true,
            smoking_allowed: false
        },
        rating: 4.8,
        review_count: 48,
        status: "available"
    };

    let currentImageIndex = 0;
    let roomData = null;

    // Load room data
    async function loadRoomData() {
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if (!roomId) {
            LuxeStay.showToast('Room not found', 'error');
            setTimeout(() => window.location.href = '/public/rooms.html', 2000);
            return;
        }

        // In production, fetch from API
        // const data = await LuxeStay.apiRequest(`/api/rooms/${roomId}`);
        // roomData = data.room;

        // For now, use mock data
        roomData = mockRoomData;
        renderRoomDetails();
    }

    function renderRoomDetails() {
        // Title and breadcrumb
        document.getElementById('room-title').textContent = roomData.room_type;
        document.getElementById('room-breadcrumb').textContent = roomData.room_type;

        // Rating
        document.getElementById('rating-value').textContent = roomData.rating;
        document.getElementById('review-count').textContent = `(${roomData.review_count} reviews)`;

        // Quick specs
        const specs = document.getElementById('quick-specs');
        specs.innerHTML = `
            <div class="spec-item">
                <i class="fas fa-bed"></i>
                <span>${roomData.bed_type} Bed</span>
            </div>
            <div class="spec-item">
                <i class="fas fa-users"></i>
                <span>${roomData.max_occupancy} Guests</span>
            </div>
            <div class="spec-item">
                <i class="fas fa-ruler-combined"></i>
                <span>${roomData.room_size} sqm</span>
            </div>
            <div class="spec-item">
                <i class="fas fa-eye"></i>
                <span>${roomData.view_type}</span>
            </div>
        `;

        // Description
        document.getElementById('room-description').textContent = roomData.description;

        // Images
        renderImages();

        // Amenities
        const amenitiesGrid = document.getElementById('amenities-grid');
        amenitiesGrid.innerHTML = roomData.amenities.map(amenity => `
            <div class="amenity-item">
                <i class="fas fa-check"></i>
                <span>${amenity}</span>
            </div>
        `).join('');

        // Policies
        const policiesList = document.getElementById('policies-list');
        policiesList.innerHTML = `
            <li class="policy-item">
                <i class="fas fa-clock"></i>
                <div>
                    <strong>Check-in:</strong> ${roomData.policies.check_in_time}<br>
                    <strong>Check-out:</strong> ${roomData.policies.check_out_time}
                </div>
            </li>
            <li class="policy-item">
                <i class="fas fa-undo"></i>
                <div>
                    <strong>Cancellation:</strong> ${roomData.policies.cancellation_policy}
                </div>
            </li>
            <li class="policy-item">
                <i class="fas fa-credit-card"></i>
                <div>
                    <strong>Deposit:</strong> ${roomData.policies.deposit_required ? 'Credit card required for reservation' : 'No deposit required'}
                </div>
            </li>
            <li class="policy-item">
                <i class="fas fa-smoking-ban"></i>
                <div>
                    <strong>Smoking:</strong> ${roomData.policies.smoking_allowed ? 'Smoking allowed' : 'Non-smoking room'}
                </div>
            </li>
        `;

        // Price
        document.getElementById('price-display').textContent = LuxeStay.formatCurrency(roomData.price_per_night);
        document.getElementById('room-id').value = roomData.id;
        document.getElementById('room-price').setAttribute('data-room-price', roomData.price_per_night);
    }

    function renderImages() {
        const mainImg = document.getElementById('main-image-img');
        mainImg.src = roomData.images[0];

        const thumbnailGrid = document.getElementById('thumbnail-grid');
        thumbnailGrid.innerHTML = roomData.images.map((img, index) => `
            <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="changeImage(${index})">
                <img src="${img}" alt="Room view ${index + 1}">
            </div>
        `).join('');
    }

    function changeImage(index) {
        currentImageIndex = index;
        const mainImg = document.getElementById('main-image-img');
        mainImg.style.opacity = '0';

        setTimeout(() => {
            mainImg.src = roomData.images[index];
            mainImg.style.opacity = '1';
        }, 300);

        // Update active thumbnail
        document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
            thumb.classList.toggle('active', i === index);
        });
    }

    // Lightbox functions
    document.getElementById('main-image').addEventListener('click', () => {
        openLightbox(currentImageIndex);
    });

    function openLightbox(index) {
        currentImageIndex = index;
        document.getElementById('lightbox-image').src = roomData.images[index];
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }

    function previousImage() {
        currentImageIndex = (currentImageIndex - 1 + roomData.images.length) % roomData.images.length;
        document.getElementById('lightbox-image').src = roomData.images[currentImageIndex];
    }

    function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % roomData.images.length;
        document.getElementById('lightbox-image').src = roomData.images[currentImageIndex];
    }

    // Close lightbox on ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') previousImage();
        if (e.key === 'ArrowRight') nextImage();
    });

    // Booking form submission
    document.getElementById('booking-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const formData = {
            room_id: document.getElementById('room-id').value,
            check_in: document.getElementById('check-in').value,
            check_out: document.getElementById('check-out').value,
            guests: document.getElementById('guests').value
        };

        // Validate dates
        const dateError = BookingUtils.validateDates(formData.check_in, formData.check_out);
        if (dateError) {
            LuxeStay.showToast(dateError, 'error');
            return;
        }

        // Save to session storage
        BookingUtils.saveBookingData({
            ...formData,
            room: roomData
        });

        // Navigate to booking flow
        window.location.href = `/public/booking-flow.html?room_id=${formData.room_id}&checkin=${formData.check_in}&checkout=${formData.check_out}&guests=${formData.guests}`;
    });

    // Load room data on page load
    loadRoomData();
</script>
