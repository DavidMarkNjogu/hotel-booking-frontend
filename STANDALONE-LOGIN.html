<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay Hotel - Login (Standalone Demo)</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* EMBEDDED CSS - Green Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Georgia", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        :root {
            --color-h: 87;
            --color-s: 100%;
            --5: hsl(var(--color-h), var(--color-s), 5%);
            --10: hsl(var(--color-h), var(--color-s), 10%);
            --20: hsl(var(--color-h), var(--color-s), 20%);
            --36: hsl(var(--color-h), var(--color-s), 36%);
            --50: hsl(var(--color-h), var(--color-s), 50%);
            --65: hsl(var(--color-h), var(--color-s), 65%);
            --81: hsl(var(--color-h), var(--color-s), 81%);
            --95: hsl(var(--color-h), var(--color-s), 95%);
            --97: hsl(var(--color-h), var(--color-s), 97%);
            --white: white;
            --lighter-gray: #f2f2f2;
            --text-secondary: #666;
        }

        body {
            background: linear-gradient(135deg, var(--97) 0%, var(--81) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            padding: 40px 40px 20px;
        }

        .login-logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--10);
            margin-bottom: 10px;
        }

        .login-logo span {
            color: var(--50);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .login-tabs {
            border-bottom: 2px solid var(--lighter-gray);
            display: flex;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab-btn.active {
            color: var(--20);
            border-bottom-color: var(--50);
        }

        .login-form-container {
            padding: 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--10);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--lighter-gray);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--50);
            box-shadow: 0 0 0 3px var(--97);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            color: var(--text-secondary);
            background: none;
            border: none;
            font-size: 16px;
        }

        .button-primary {
            width: 100%;
            padding: 12px;
            background: var(--50);
            color: var(--10);
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-primary:hover {
            background: var(--36);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { border-left: 4px solid #4caf50; color: #2e7d32; }
        .toast.error { border-left: 4px solid #f44336; color: #c62828; }

        .form-help {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .login-form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <h1 class="login-logo"><span>Luxe</span>Stay</h1>
            <p class="login-subtitle">Welcome back! Please login to your account</p>
        </div>

        <!-- Tabs -->
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Forms Container -->
        <div class="login-form-container">
            <!-- Login Form -->
            <form id="login-tab" class="tab-content active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="button-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-tab" class="tab-content" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="register-password" class="form-input" placeholder="Create a password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('register-password')">
                        <i class="fas fa-eye"></i>
                    </button>
                    <small class="form-help">At least 8 characters with uppercase, lowercase, and number</small>
                </div>

                <button type="submit" class="button-primary">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        // Password toggle
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                button.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }

        // Show toast
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            showToast('Login successful! 🎉', 'success');
        }

        // Handle register
        function handleRegister(event) {
            event.preventDefault();
            showToast('Account created successfully! 🎉', 'success');
        }
    </script>

</body>
</html>
